[build-system]
requires = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pmiri"
version = "0.1.0"
description = "Local-first, provenance-preserving evidence and retrieval runtime"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42,<51",
    "idna>=3.7,<4",
    "jsonschema>=4.23,<5",
]

[project.scripts]
pmiri = "pmiri.cli:main"

[tool.setuptools.packages.find]
include = ["pmiri*"]
exclude = ["tests*"]

[tool.pmiri]
python = "3.12"
network = "DENY_BY_DEFAULT"
external_providers = "EXPLICIT_ADAPTER_DISABLED_BY_DEFAULT"
